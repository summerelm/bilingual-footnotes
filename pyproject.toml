[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "coverage>=7.10,<8",
    "import-linter>=2.13,<3",
    "mypy>=1.17,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
    "types-defusedxml>=0.7,<1",
]
desktop-build = [
    "cython==3.2.9",
    "numpy==1.26.4",
    "pillow==12.3.0",
    "pyinstaller==6.22.2",
    "scikit-learn==1.5.2",
    "scipy==1.13.1",
    "sentence-transformers==5.7.0",
    "torch==2.2.2",
    "transformers==4.57.6",
    "vecalign @ git+https://github.com/thompsonb/vecalign.git@f37262758955133d0c9ef1fdff45eba25842a62c",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "C901", "SIM", "C4", "PIE", "TID251", "RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]
"tools/**/*.py" = ["S603"]
"src/bilingual_text_align/setup_worker.py" = ["S603"]
"src/bilingual_text_align/worker_transport.py" = ["S603"]

[tool.mypy]
mypy_path = [
    "packages/bilingual-text-align/src",
    "packages/epub-bilingual-footnotes/src",
    "packages/bilingual-text-align-ui/src",
]
strict = true
