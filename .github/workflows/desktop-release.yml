name: Desktop builds

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            architecture: x86_64
            artifact: windows-x86_64
          - label: macOS Intel
            runner: macos-15-intel
            architecture: x86_64
            artifact: macos-x86_64
          - label: macOS Apple Silicon
            runner: macos-15
            architecture: arm64
            artifact: macos-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install release environment
        run: uv sync --python 3.12 --locked --all-packages --no-default-groups --group desktop-build

      - name: Build and verify desktop archive
        run: uv run --python 3.12 --locked --no-default-groups --group desktop-build python tools/release/build_desktop.py --architecture ${{ matrix.architecture }}

      - name: Upload desktop archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/release/*.zip
            dist/release/*.sha256
          compression-level: 0
          if-no-files-found: error

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: "*-*"
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Bilingual Footnotes $GITHUB_REF_NAME" release-assets/*
