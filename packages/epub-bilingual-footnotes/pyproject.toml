[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[project]
name = "epub-bilingual-footnotes"
version = "0.1.0"
description = "Add aligned bilingual footnotes to EPUB books"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "summerelm"}]
keywords = ["bilingual", "ebook", "epub", "footnotes", "translation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = ["beautifulsoup4>=4.14,<5", "bilingual-text-align>=0.1,<0.2", "defusedxml>=0.7,<1"]

[project.scripts]
bilingual-footnotes = "epub_bilingual_footnotes.cli:main"

[tool.uv.sources]
bilingual-text-align = {workspace = true}

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "journey: model-backed tests that require the installed semantic runtime",
]
[tool.coverage.run]
branch = true
source_pkgs = ["epub_bilingual_footnotes"]
[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_empty = true
