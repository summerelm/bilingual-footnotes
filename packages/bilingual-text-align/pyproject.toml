[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[project]
name = "bilingual-text-align"
version = "0.1.0"
description = "Protocol-driven monotonic alignment for parallel bilingual text"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "summerelm"}]
keywords = ["alignment", "bilingual", "epub", "labse", "vecalign"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
bilingual-align = "bilingual_text_align.cli:main"
bilingual-align-setup = "bilingual_text_align.setup_worker:main"
bilingual-align-resources = "bilingual_text_align.resources_cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source_pkgs = ["bilingual_text_align"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_empty = true
